# Keep a fork of lexifina/serbia-law current and see how current it is.
# Copy this file to .github/workflows/refresh.yml in your fork, commit it to main, and enable Actions in the fork.
# Free on a public repository. It never reads the official sources; it takes lexifina/serbia-law's new commits.
name: Refresh from lexifina/serbia-law

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sync main with lexifina/serbia-law (GitHub's own "Sync fork")
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild WATCHING, FRESHNESS and monitoring/
        run: python monitoring/make_pages.py --ref HEAD

      - name: Publish the pages to the status branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898713+github-actions[bot]@users.noreply.github.com"
          git checkout -B status
          git add WATCHING.md WATCHING.en.md FRESHNESS.md FRESHNESS.en.md monitoring/README.md monitoring/README.en.md
          git commit -m "Status of this fork on $(date -u +%Y-%m-%d)" || echo "No changes"
          git push --force origin status

      - name: Show freshness in the run summary
        run: cat FRESHNESS.en.md >> "$GITHUB_STEP_SUMMARY"
