function hideTip() { tip.style.opacity = 0; }
function bindTip(sel, fn) {
  sel.on('mouseenter', (ev, d) => showTip(ev, fn(d))).on('mousemove', moveTip).on('mouseleave', hideTip)
     .on('touchstart', (ev, d) => { const tt = ev.touches[0]; showTip({ clientX: tt.clientX, clientY: tt.clientY }, fn(d)); }, { passive: true });
}
const trow = (sw, k, v) => `<div class="r"><span>${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${esc(k)}</span><span>${v}</span></div>`;

// ------------------------------------------------------------------ chart scaffolding
function legend(el, items) {
  const lg = el.append('div').attr('class', 'legend');
  items.forEach(it => { const s = lg.append('span'); s.append('i').attr('class', it.shape || '').style('background', it.c); s.append('span').text(it.l); });
}
function svgIn(el, w, h) { return el.append('div').attr('class', 'plot').append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('width', w).attr('height', h).attr('role', 'img'); }
function table(el, head, rows) {
  const d = el.append('details').attr('class', 'tbl');
  d.append('summary').text(t('tbl'));
  const tb = d.append('div').attr('class', 'scroll').append('table');
  tb.append('thead').append('tr').selectAll('th').data(head).join('th').attr('class', (h, i) => i ? 'n' : null).text(h => h);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').attr('class', (v, i) => i ? 'n' : null).text(v => typeof v === 'number' ? fmt(v) : v);
}
function note(el, src, n, extra) {
  const p = el.append('p').attr('class', 'note');
  p.html(`<b>${t('src')}:</b> ${src.map(s => `<code>${esc(s)}</code>`).join(' ')} · <b>${t('n')}:</b> ${n}${extra ? ' · ' + extra : ''}`);
}
function yAxis(g, y, w, ticks = 5, f = fmt) {
  const ax = g.append('g').attr('class', 'axis grid');
  y.ticks(ticks).forEach(v => {
    ax.append('line').attr('x1', 0).attr('x2', w).attr('y1', y(v)).attr('y2', y(v));
    ax.append('text').attr('x', -6).attr('y', y(v)).attr('dy', '0.32em').attr('text-anchor', 'end').text(f(v));
  });
}
const W = el => Math.max(300, Math.min(1000, el.node().getBoundingClientRect().width || 900));
const narrow = w => w < 560;
// column with rounded top only
function colPath(x, y0, w, y1, r = 4) {
  const h = y0 - y1; if (h <= 0) return '';
  r = Math.min(r, h, w / 2);
  return `M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 + r}V${y0}Z`;
}
function barPath(x0, y, x1, h, r = 4) {
  const w = x1 - x0; if (w <= 0) return '';
  r = Math.min(r, w, h / 2);
  return `M${x0},${y}H${x1 - r}Q${x1},${y} ${x1},${y + r}V${y + h - r}Q${x1},${y + h} ${x1 - r},${y + h}H${x0}Z`;
}
// stacked columns, keys bottom-up; the top segment gets the rounded end, 2px surface gaps
function stackedColumns(el, rows, keys, colors, names, opt = {}) {
  const w = W(el), h = opt.h || 300, m = { t: 14, r: 8, b: 26, l: 44 };
  const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  const iw = w - m.l - m.r, ih = h - m.t - m.b;
  const x = d3.scaleBand().domain(rows.map(r => r.y)).range([0, iw]).padding(0.25);
  const tot = r => keys.reduce((s, k) => s + (r[k] || 0), 0);
  const y = d3.scaleLinear().domain([0, opt.max || d3.max(rows, tot)]).nice().range([ih, 0]);
  yAxis(g, y, iw, opt.ticks || 5, opt.yf);
  const bw = Math.min(24, x.bandwidth());
  rows.forEach(r => {
    let acc = 0; const segs = keys.map((k, i) => ({ k, i, v: r[k] || 0 })).filter(s => s.v > 0);
    const gx = x(r.y) + (x.bandwidth() - bw) / 2;
    segs.forEach((s, j) => {
      const y0 = y(acc), y1 = y(acc + s.v); acc += s.v;
      const gap = j ? 1 : 0, top = j === segs.length - 1;
      const yy0 = y0 - gap, yy1 = top ? y1 : y1 + 1;
      if (yy0 - yy1 < 0.5) return;
      g.append('path').attr('d', top ? colPath(gx, yy0, bw, yy1) : `M${gx},${yy0}V${yy1}H${gx + bw}V${yy0}Z`).attr('fill', colors[s.i]).attr('opacity', opt.partial && opt.partial(r) ? 0.55 : 1);
    });
    if (opt.topLabel) g.append('text').attr('class', 'lbl').attr('x', gx + bw / 2).attr('y', y(tot(r)) - 5).attr('text-anchor', 'middle').text(opt.topLabel(r));
  });
  g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
  const every = Math.ceil(rows.length / Math.max(4, Math.floor(iw / 44)));
  rows.forEach((r, i) => { if (i % every === 0 || (i === rows.length - 1 && (rows.length - 1) % every >= every / 2)) g.append('text').attr('class', 'lbl').attr('x', x(r.y) + x.bandwidth() / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(opt.xf ? opt.xf(r.y) : r.y); });
  bindTip(g.selectAll('.hit').data(rows).join('rect').attr('class', 'hit').attr('x', r => x(r.y)).attr('width', x.bandwidth()).attr('y', 0).attr('height', ih),
    r => `<b>${opt.xf ? opt.xf(r.y) : r.y}${opt.partial && opt.partial(r) ? ' (' + t('partial') + ')' : ''}</b>` + keys.map((k, i) => (r[k] ? trow(colors[i], names[i], fmt(r[k]) + ` · ${pct(r[k], tot(r))}`) : '')).reverse().join('') + trow(null, t('total'), fmt(tot(r))));
  return { svg, g, x, y };
}

// ------------------------------------------------------------------ helpers for data
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const BT = { amend: ['Izmene i dopune', 'Amendments'], new: ['Novi zakoni', 'New laws'], treaty: ['Potvrđivanje ugovora', 'Treaty ratifications'],
  loan: ['Ugovori o zajmu', 'Loan agreements'], guarantee: ['Garancije države', 'State guarantees'], budget: ['Budžet i završni račun', 'Budget and final accounts'], interp: ['Autentično tumačenje', 'Authentic interpretation'] };

// ------------------------------------------------------------------ the charts
const CH = [];
const part = (id, sr, en, dsr, den) => CH.push({ part: true, id, sr, en, dsr, den });
const chart = (id, fn) => CH.push({ id, fn });

part('p1', 'I. Narodna skupština', 'I. The National Assembly',
  'Predlozi zakona i zakoni sa sajta Narodne skupštine (data/bills-<godina>.csv): kada je predlog podnet, da li je usvojen i kada.',
  'Bills and laws from the National Assembly\'s website (data/bills-<year>.csv): when each bill was filed, whether it passed and when.');

chart('c01', el => {
  const c = D.c01, keys = ['amend', 'new', 'treaty', 'loan', 'guarantee', 'budget'], cols = S8();
  const colors = [cols[0], cols[1], cols[2], cols[3], cols[4], cols[6]];
  const names = keys.map(k => L(...BT[k]));
  const all = {}; keys.forEach(k => all[k] = sum(c.rows, r => r[k] || 0)); const N = sum(c.rows, r => sum(keys, k => r[k] || 0));
  const y1 = c.years[c.years.length - 1];
  return {
    title: L('Šta Skupština usvaja: pre svega izmene postojećih zakona i potvrđivanje ugovora', 'What the Assembly passes: mostly amendments to existing laws and ratified agreements'),
    dek: L(`Od ${fmt(N)} zakona usvojenih ${c.years[0]}–${y1}, ${pct(all.amend, N)} menja postojeće zakone, ${pct(all.treaty, N)} potvrđuje međunarodne ugovore, a ${pct(all.loan + all.guarantee, N)} su zajmovi i državne garancije. Potpuno novih zakona je ${pct(all.new, N)}.`,
      `Of ${fmt(N)} laws passed in ${c.years[0]}–${y1}, ${pct(all.amend, N)} amend existing laws, ${pct(all.treaty, N)} ratify international agreements and ${pct(all.loan + all.guarantee, N)} are loans and state guarantees. Entirely new laws are ${pct(all.new, N)}.`),
    draw(el) {
      legend(el, keys.map((k, i) => ({ c: colors[i], l: names[i] })));
      stackedColumns(el, c.rows, keys, colors, names, { partial: r => r.y === y1, topLabel: r => fmt(sum(keys, k => r[k] || 0)) });
      note(el, ['data/bills-*.csv'], fmt(N) + ' ' + t('laws'), L(`vrsta je određena iz naslova predloga („o izmenama i dopunama“, „o potvrđivanju“, „zajam/kredit“, „garancija“, „budžet“); ${y1} je delimična godina (do ${dateTxt(PF.bills.last_adopted)}); godine sa manje od 40 usvojenih zakona su izostavljene jer spisak za njih nije potpun.`, `type read from the bill title ("amending", "ratifying", "loan/credit", "guarantee", "budget"); ${y1} is a partial year (to ${dateTxt(PF.bills.last_adopted)}); years with fewer than 40 laws are left out because the list for them is incomplete.`));
      table(el, [t('year'), ...names, t('total')], c.rows.map(r => [String(r.y), ...keys.map(k => r[k] || 0), sum(keys, k => r[k] || 0)]));
    }
  };
});

chart('c02', el => {

      x.ticks(narrow(w) ? 5 : 10).forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v)).attr('y', ih + 16).attr('text-anchor', 'middle').text(v.getFullYear()));
      const col = css('--s1');
      g.append('line').attr('x1', 0).attr('x2', iw).attr('y1', y(10)).attr('y2', y(10)).attr('stroke', css('--text-3')).attr('stroke-dasharray', null).attr('stroke-width', 1).attr('opacity', .5);
      g.append('text').attr('class', 'lbl mut').attr('x', iw).attr('y', y(10) - 4).attr('text-anchor', 'end').text(L('10 zakona u jednom danu', '10 laws in one day'));
      g.selectAll('line.st').data(days).join('line').attr('class', 'st').attr('x1', d => x(pd(d.d))).attr('x2', d => x(pd(d.d))).attr('y1', ih).attr('y2', d => y(d.n)).attr('stroke', col).attr('stroke-width', 1).attr('opacity', .35);
      const dots = g.selectAll('circle').data(days).join('circle').attr('cx', d => x(pd(d.d))).attr('cy', d => y(d.n)).attr('r', d => d.n >= 10 ? 4.5 : 3).attr('fill', col).attr('stroke', css('--surface')).attr('stroke-width', 1.5);
      bindTip(dots, d => `<b>${dateTxt(d.d)}</b>` + trow(null, L('Usvojeno zakona', 'Laws passed'), d.n) + Object.entries(d.t).sort((a, b) => b[1] - a[1]).map(([k, v]) => trow(null, L(...BT[k]), v)).join(''));
      const placed = [];

        for (const [lx, ly, an] of cands) {

      note(el, ['data/bills-*.csv (law_adopted)'], fmt(c.n_laws) + ' ' + t('laws'), L('Poslovnik Narodne skupštine dozvoljava zajednički načelni pretres o više predloga (čl. 157), a o svakom se glasa posebno; zato veliki dani za glasanje nastaju na kraju zasedanja.', 'The Assembly\'s Rules of Procedure allow a joint general debate on several bills (art. 157), each voted separately; that is how the big voting days at the end of a session come about.'));
      table(el, [L('Dan', 'Day'), L('Zakona', 'Laws')], c.days.slice().sort((a, b) => b.n - a.n).slice(0, 40).map(d => [d.d, d.n]));
    }

    dek: L(`Ustav (čl. 196) propisuje da zakoni i drugi opšti akti stupaju na snagu najranije osmog dana od objavljivanja, a ranije samo iz naročito opravdanih razloga. Od ${fmt(AN)} novih akata, ${pct(early(A), AN)} je stupilo na snagu ranije (${pct(A.same || 0, AN)} istog dana, ${pct(A.next || 0, AN)} sutradan). Zakoni se pravila drže; uredbe i odluke mnogo ređe.`,
      `The Constitution (art. 196) says laws and other general acts take effect on the eighth day after publication at the earliest, and earlier only for especially justified reasons. Of ${fmt(AN)} new acts, ${pct(early(A), AN)} took effect earlier (${pct(A.same || 0, AN)} the same day, ${pct(A.next || 0, AN)} the next day). Laws keep to the rule; decrees and decisions much less often.`),

      ks.forEach((k, ki) => {

        const cell = box.append('div');
        cell.append('h4').text(`${L(...KIND[k])} · ${pct(e, tot)}`);
        const w = Math.floor(cellW), h = 160, m = { t: 8, r: 8, b: 22, l: 34 };

        const x = d3.scaleLinear().domain([2009, 2026]).range([0, iw]), y = d3.scaleLinear().domain([0, 0.6]).range([ih, 0]);

        [2010, 2018, 2026].forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v)).attr('y', ih + 15).attr('text-anchor', 'middle').text(v));
        const col = cols[0];
        g.append('path').datum(rows).attr('fill', 'none').attr('stroke', col).attr('stroke-width', 2).attr('stroke-linejoin', 'round').attr('d', d3.line().x(r => x(r.y)).y(r => y(early(r) / r.n)));

          r => `<b>${L(...KIND[k])}, ${r.y}</b>` + trow(null, L('Novih akata', 'New acts'), r.n) + trow(null, L('Isti dan', 'Same day'), r.same || 0) + trow(null, L('Sutradan', 'Next day'), r.next || 0) + trow(null, L('2–7 dana', '2–7 days'), r.early || 0) + trow(null, L('Osmi dan', 'Eighth day'), r.eighth || 0) + trow(null, L('Kasnije', 'Later'), r.later || 0) + trow(null, L('Pre osmog dana', 'Before the eighth day'), pct(early(r), r.n)));
      });

      rows.forEach((r, i) => {

      });

chart('c11', el => {
  const c = D.c11;
  const N = sum(c.rows, r => r.n), dec = sum(c.rows, r => r.m[11]), jan = sum(c.rows, r => r.m[0]), j1 = sum(c.rows, r => r.jan1);
  return {
    title: L('Pravna godina: izmene najčešće stupaju na snagu u decembru i januaru', 'The legal year: changes most often take effect in December and January'),
    dek: L(`Izmene propisa (ne novi propisi) po mesecu stupanja na snagu, 2016–2025. Decembar i januar nose ${pct(dec + jan, N)} od ${fmt(N)} izmena; ${fmt(j1)} izmena stupilo je na snagu baš 1. januara.`,
      `Amendments (not new acts) by the month they took effect, 2016–2025. December and January carry ${pct(dec + jan, N)} of ${fmt(N)} changes; ${fmt(j1)} took effect exactly on 1 January.`),
    draw(el) {
      const w = W(el), nw = narrow(w), m = { t: 22, r: 54, b: 8, l: 40 };
      const cw = (w - m.l - m.r) / 12, ch = nw ? 22 : 28, h = m.t + m.b + c.rows.length * ch;
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const mx = d3.max(c.rows, r => d3.max(r.m));
      const col = d3.scaleSequential(d3.interpolateRgb(css('--seq-lo'), css('--seq-hi'))).domain([0, mx]);
      MONTHS[LANG].forEach((mm, i) => g.append('text').attr('class', 'lbl').attr('x', i * cw + cw / 2).attr('y', -7).attr('text-anchor', 'middle').text(nw ? mm[0].toUpperCase() : mm));
      g.append('text').attr('class', 'lbl mut').attr('x', 12 * cw + 6).attr('y', -7).text(t('total'));
      c.rows.forEach((r, i) => {
        g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', i * ch + ch / 2 + 4).attr('text-anchor', 'end').text(r.y);
        g.append('text').attr('class', 'lbl').attr('x', 12 * cw + 6).attr('y', i * ch + ch / 2 + 4).text(fmt(r.n));
        bindTip(g.append('g').selectAll('rect').data(r.m.map((v, k) => ({ v, k }))).join('rect').attr('x', d => d.k * cw + 1).attr('y', i * ch + 1).attr('width', cw - 2).attr('height', ch - 2).attr('rx', 3).attr('fill', d => col(d.v)),
          d => `<b>${MONTHS[LANG][d.k]} ${r.y}</b>` + trow(null, L('Izmena stupilo na snagu', 'Changes in force'), d.v) + (d.k === 0 ? trow(null, L('od toga 1. januara', 'of which on 1 January'), r.jan1) : '') + trow(null, L('Udeo u godini', 'Share of the year'), pct(d.v, r.n)));
        r.m.forEach((v, k) => { if (v === d3.max(r.m) && !nw) g.append('text').attr('class', 'lbl').attr('x', k * cw + cw / 2).attr('y', i * ch + ch / 2 + 4).attr('text-anchor', 'middle').style('fill', v > mx * 0.55 ? css('--surface') : css('--text')).text(v); });
      });
      note(el, ['git log (Kind: law, In-force)'], fmt(N), L('komit sa izmenom teksta postojećeg akta, po danu stupanja na snagu iz registra. Pre 2016. registar ima malo izmenjenih tekstova, pa te godine nisu prikazane.', 'a commit that changes the text of an existing act, by the register\'s day of entry into force. Before 2016 the register holds few amended texts, so those years are not shown.'));
      table(el, [t('year'), ...MONTHS[LANG], t('total')], c.rows.map(r => [String(r.y), ...r.m, r.n]));
    }

});

part('p3', 'III. Ustavni sud', 'III. The Constitutional Court',
  'Odluke iz baze sudske prakse Ustavnog suda (sudska-praksa/ustavni-sud/), sa podacima iz prikolica komita: broj predmeta, datum odluke, ishod, oblast, odredbe Ustava i osporeni akt.',
  'Decisions from the Constitutional Court\'s case-law database (sudska-praksa/ustavni-sud/), with data from the commit trailers: case number, date of decision, outcome, area, the Constitution\'s provisions and the act challenged.');

      `${fmt(N)} decisions on constitutional complaints (Už) from the case-law database, by year of decision. ${pct(T0.granted, N)} are granted. That is not a success rate: the Court does not enter every decision in the database, and dismissed complaints almost vanish from it after 2011.`),

      table(el, [t('year'), ...keys.map(k => L(...OC[k])), t('total')], c.rows.map(r => [String(r.y), ...keys.map(k => r[k] || 0), sum(keys, k => r[k] || 0)]));

chart('c14', el => {
  const c = D.c14;
  const fys = d3.range(2007, 2027), dys = d3.range(2008, 2027);
  const M = new Map(c.cells.map(x => [x.f + '-' + x.d, x.n]));
  return {
    title: L('Koliko žalba čeka: godina podnošenja naspram godine odluke', 'How long a complaint waits: the year it was filed against the year it was decided'),
    dek: L('Godina podnošenja je iz broja predmeta (Už-1234/2013 = podneta 2013). Svaki red je jedna godina odluke; što je ćelija dalje levo od dijagonale, to je žalba duže čekala. Medijana čekanja se kreće oko dve do tri godine.',
      'The filing year comes from the case number (Už-1234/2013 = filed in 2013). Each row is one year of decision; the further a cell sits left of the diagonal, the longer the complaint waited. The median wait is around two to three years.'),
    draw(el) {
      const w = W(el), nw = narrow(w), m = { t: 8, r: 64, b: 34, l: 40 };
      const cw = (w - m.l - m.r) / fys.length, ch = nw ? 16 : 20, rows = dys.filter(d => c.cells.some(x => x.d === d));
      const h = m.t + m.b + rows.length * ch;
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const mx = d3.max(c.cells, x => x.n);
      const col = d3.scaleSequentialSqrt(d3.interpolateRgb(css('--seq-lo'), css('--seq-hi'))).domain([0, mx]);
      fys.forEach((f, i) => { if (i % (nw ? 4 : 2) === 0) g.append('text').attr('class', 'lbl').attr('x', i * cw + cw / 2).attr('y', rows.length * ch + 14).attr('text-anchor', 'middle').text(f); });
      g.append('text').attr('class', 'lbl mut').attr('x', 0).attr('y', rows.length * ch + 28).text(L('godina podnošenja →', 'year filed →'));
      g.append('text').attr('class', 'lbl mut').attr('x', fys.length * cw + 6).attr('y', -0).text(L('medijana', 'median'));
      rows.forEach((d, j) => {
        g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', j * ch + ch / 2 + 4).attr('text-anchor', 'end').text(d);
        const med = c.med[d];
        if (med != null) g.append('text').attr('class', 'lbl').attr('x', fys.length * cw + 6).attr('y', j * ch + ch / 2 + 4).text(med + L(' god.', ' yr'));
        fys.forEach((f, i) => {
          const n = M.get(f + '-' + d); if (!n) return;
          bindTip(g.append('rect').attr('x', i * cw + 1).attr('y', j * ch + 1).attr('width', cw - 2).attr('height', ch - 2).attr('rx', 2).attr('fill', col(n)).datum({ f, d, n }),
            x => `<b>${L('Odlučeno', 'Decided')} ${x.d}, ${L('podneto', 'filed')} ${x.f}</b>` + trow(null, L('Odluka', 'Decisions'), fmt(x.n)) + trow(null, L('Čekanje', 'Wait'), (x.d - x.f) + L(' god.', ' years')));
        });
      });
      note(el, ['git log (Case: Уж-N/GGGG, Decided)'], fmt(c.n), L('samo objavljene odluke o ustavnim žalbama; razlika godina nije tačno trajanje u danima (žalba podneta u decembru i rešena u januaru „čeka godinu dana“).', 'published decisions on constitutional complaints only; a difference of years is not an exact duration (a complaint filed in December and decided in January "waits a year").'));
      table(el, [L('Odlučeno', 'Decided'), ...fys.map(String), L('Medijana', 'Median')], rows.map(d => [String(d), ...fys.map(f => M.get(f + '-' + d) || 0), c.med[d] != null ? c.med[d] : '–']));
    }

          bindTip(g.append('rect').attr('x', i * cw + 1).attr('y', j * ch + 1 + (isCity ? 0 : 6)).attr('width', cw - 2).attr('height', ch - 2).attr('rx', 2)
            .attr('fill', isCity ? d3.interpolateRgb(css('--seq-lo'), css('--s2'))(Math.min(1, n / d3.max(Object.values(city.by)))) : col(Math.min(n, mxM))).datum({ y, n }),
            d => `<b>${isCity ? L('Grad Beograd', 'City of Belgrade') : esc(r.i)}, ${d.y}</b>` + trow(null, L('Akata', 'Acts'), fmt(d.n)));
        });
      });
      note(el, ['data/local/beograd/acts-*.csv (section, date)'], fmt(N), L('Grad (prvi red) ima svoju skalu boja jer objavljuje mnogo više od bilo koje opštine; opštine dele jednu skalu. Ispravke i akti javnih preduzeća nisu uračunati. Tekstovi akata iz 2024–2026 su u fascikli local/.', 'the City (first row) has its own colour scale because it publishes far more than any one municipality; the municipalities share one scale. Corrections and public companies\' acts are not counted. The texts of acts from 2024–2026 are in local/.'));
      table(el, [L('Izdavalac', 'Issuer'), ...ys.map(String), t('total')], rows.map(r => [r.i === 'Grad Beograd' ? L('Grad Beograd', 'City of Belgrade') : r.i, ...ys.map(y => r.by[y] || 0), r.n]));
    }
  };
});

// reading order (chart numbers follow it): money and treaties straight after what the Assembly passes
const ORDER = ['p1', 'c01', 'c04', 'c05', 'c02', 'c03', 'p2', 'c06', 'c07', 'c08', 'c09', 'c10', 'c11', 'p3', 'c12', 'c13', 'c14', 'c15', 'c16', 'p4', 'c17', 'c18', 'c19', 'p5', 'c20'];
CH.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

// ------------------------------------------------------------------ page
function profileTable() {
  const P = PF, el = d3.select('#profile').html('');
  const rows = [
    [L('Istorija gita (svi komiti)', 'Git history (every commit)'), 'git log origin/main', fmt(P.commits), L('komiti po vrsti: ', 'commits by kind: ') + P.kinds.map(([k, n]) => `${k} ${fmt(n)}`).join(', '), L('datum komita je datum stupanja na snagu ili odluke, ne datum unosa', 'the commit date is the date of force or decision, not of entry')],
    [L('Akti u registru', 'Register acts'), '<vrsta>/<godina>/<broj>/, registry/data/acts.json', fmt(P.acts_in_tree), L('važeći akti PIS-a; najstariji iz 1947.', 'acts in force in the Legal Information System; the oldest from 1947'), L('ukinuti akti nisu u registru; tekstovi pre ~2015. često postoje samo kao najstarija dostupna verzija', 'repealed acts are not in the register; texts before ~2015 often exist only as the oldest available version')],
    [L('Predlozi zakona', 'Bills'), 'data/bills-*.csv', `${fmt(P.bills.filed)} (${fmt(P.bills.adopted)} ${L('usvojeno', 'passed')})`, `${P.bills.first_filed.slice(0, 4)}–${P.bills.last_adopted.slice(0, 4)}`, L('pre 2011. spisak je nepotpun; nema podatka o hitnom postupku ni o predlagaču', 'incomplete before 2011; no field for urgent procedure or for the sponsor')],
    [L('Ustavni sud', 'Constitutional Court'), 'sudska-praksa/ustavni-sud/', `${fmt(P.cc.decisions)} (${fmt(P.cc.uz)} Už)`, `${P.cc.first.slice(0, 4)}–${P.cc.last.slice(0, 4)}`, L('baza je izbor koji Sud objavljuje, ne sve odluke; tekst odluka koje imenuju fizička lica je izostavljen', 'the database is a selection the Court publishes, not every decision; the text of decisions naming private persons is withheld')],
    [L('Žalbe Povereniku', 'Appeals to the Commissioner'), 'data/registers/poverenik/', fmt(P.poverenik.appeals), `${P.poverenik.first.slice(0, 4)}–${P.poverenik.last.slice(0, 4)}`, L('registar Poverenika sa portala otvorenih podataka; ishod je za većinu žalbi „No data“', 'the Commissioner\'s register from the open-data portal; the outcome is "No data" for most appeals')],
    [L('Preporuke DRI', 'SAI recommendations'), 'data/registers/dri/', fmt(D.c19.n), L('status na dan 30. 4. 2026.', 'status on 30 April 2026'), L('status prijavljuje DRI', 'status as reported by the SAI')],
    [L('Sl. list Grada Beograda', 'Belgrade Official Gazette'), 'data/local/beograd/', fmt(P.local.beograd_index), '2002–2014', L('sadržaj (naslovi) za 2002–2014; tekstovi lokalnih akata od 2024. su u local/ (' + fmt(P.local.local_texts) + ')', 'contents (titles) for 2002–2014; texts of local acts from 2024 are in local/ (' + fmt(P.local.local_texts) + ')')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(v)}</code>` : esc(v));
}
// row labels drawn left of a plot (text-anchor end, negative x) are cut with an ellipsis to the margin they have
function fitLeftLabels(fig) {
  fig.selectAll('svg text').each(function () {
    if (this.getAttribute('text-anchor') !== 'end' || !(+this.getAttribute('x') < 0)) return;
    const svg = this.ownerSVGElement, room = this.getBoundingClientRect().right - svg.getBoundingClientRect().left - 2;
    if (this.getComputedTextLength() <= room) return;
    const full = this.textContent;
    d3.select(this).append('title').text(full);
    let lo = 0, hi = full.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; this.firstChild.nodeValue = full.slice(0, mid) + '…'; if (this.getComputedTextLength() <= room) lo = mid; else hi = mid - 1; }
    this.firstChild.nodeValue = full.slice(0, lo) + '…';
  });
}
function render() {
  document.documentElement.lang = LANG === 'sr' ? 'sr-Latn' : 'en';
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tl = t('tiles'), tv = [PF.commits, PF.acts_in_tree, PF.bills.filed, PF.cc.decisions, PF.poverenik.appeals, PF.local.beograd_index];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html((v, i) => `<b>${fmt(v)}</b><span>${tl[i]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.sr, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dsr, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.sr, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    const spec = c.fn(fig);
    fig.append('div').attr('class', 'num').text(`${n} / 20`);
    fig.append('h3').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    fitLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.title.split(':')[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', PF.built + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('rs-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('rs-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
</script>
